syntax = "proto3";

package sensor;

message SensorData {
    repeated float temperature = 1;
    repeated float precipitation = 2;
    repeated float soil_moisture = 3;
    repeated float wind = 4;
    float pressure = 5;
    uint32 light_level = 6;
    bool raining = 7;
    uint64 timestamp = 8;
    string device_id = 9;
    uint32 battery_level = 10;
    uint32 sequence_number = 11;
}
